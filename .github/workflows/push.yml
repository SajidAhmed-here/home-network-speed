name: Main Workflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Dependencies, formatting, and container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # /health does not query the database; no production secrets are needed.
      # The dashboard routes use MySQL-specific SQL and are not tested with SQLite.
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      PORT: "8000"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # palettable 3.3.0 imports pkg_resources; match the Python 3.11 image.
          python -m pip install setuptools==79.0.1
          python -m pip install -r requirements.txt
          python -m pip install black==22.8.0
          python -m pip check

      - name: Check formatting
        run: python -m black app --check --verbose

      - name: Check application startup
        run: |
          python - <<'PY'
          from app import app

          with app.test_client() as client:
              response = client.get("/health")
              assert response.status_code == 200, response.status_code
              assert response.get_data(as_text=True) == "ok"
          PY

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker build --tag home-network-speed:ci .

      - name: Start application container
        run: |
          docker run --detach --name home-network-speed-ci \
            --env SQLALCHEMY_DATABASE_URI --env PORT \
            --publish "127.0.0.1:${PORT}:${PORT}" \
            home-network-speed:ci

      - name: Check HTTP health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 2 --retry-all-errors --retry-max-time 60 \
            --connect-timeout 2 --max-time 5 \
            "http://127.0.0.1:${PORT}/health" --output /tmp/health-response
          test "$(cat /tmp/health-response)" = "ok"

      - name: Show container logs
        if: always()
        run: |
          if docker container inspect home-network-speed-ci > /dev/null 2>&1; then
            docker logs home-network-speed-ci
          fi

      - name: Remove application container
        if: always()
        run: |
          if docker container inspect home-network-speed-ci > /dev/null 2>&1; then
            docker rm --force home-network-speed-ci
          fi
